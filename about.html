<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="About this beautiful Hello World project" />
    <title>About · Hello, World!</title>
    <style>
      :root { color-scheme: dark; --ink: #f8fbff; --muted: #b9c3db; --violet: #8b5cf6; --blue: #38bdf8; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 1.5rem; display: grid; place-items: center; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: radial-gradient(circle at 12% 12%, rgba(56,189,248,.22), transparent 26rem), radial-gradient(circle at 90% 82%, rgba(139,92,246,.3), transparent 30rem), #090d1b; }
      main { width: min(100%, 48rem); padding: clamp(2rem, 6vw, 4.5rem); border: 1px solid rgba(255,255,255,.16); border-radius: 2rem; background: rgba(17,24,48,.72); box-shadow: 0 2rem 5rem rgba(0,0,0,.35); backdrop-filter: blur(18px); }
      nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: clamp(3rem, 8vw, 5rem); }
      .brand, nav a { color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 750; }
      .brand { color: var(--ink); letter-spacing: -.02em; }
      .links { display: flex; gap: 1rem; }
      nav a:hover, nav a[aria-current="page"] { color: var(--ink); }
      .eyebrow { margin: 0 0 1rem; color: var(--blue); font-size: .78rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.8rem, 8vw, 5.3rem); letter-spacing: -.07em; line-height: .98; background: linear-gradient(110deg,#fff,#c4b5fd 50%,#7dd3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .lead { max-width: 38rem; color: var(--muted); font-size: 1.12rem; line-height: 1.75; }
      .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 2.25rem; }
      .card { padding: 1.15rem; border: 1px solid rgba(255,255,255,.12); border-radius: 1rem; background: rgba(255,255,255,.04); }
      .card span { display: block; margin-bottom: .45rem; color: var(--blue); font-size: 1.3rem; }
      .card strong { font-size: .95rem; }
      @media (max-width: 35rem) { .cards { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Main navigation">
        <a class="brand" href="index.html">✦ Hello, World!</a>
        <span class="links"><a href="index.html">Home</a><a href="about.html" aria-current="page">About</a><a href="contact.html">Contact</a></span>
      </nav>
      <p class="eyebrow">The story so far</p>
      <h1>Made for a bright start.</h1>
      <p class="lead">This little corner of the web is a reminder that every great idea starts somewhere—often with a friendly greeting and a clean canvas.</p>
      <section class="cards" aria-label="Our values">
        <article class="card"><span>✦</span><strong>Curious by nature</strong></article>
        <article class="card"><span>◌</span><strong>Simple with purpose</strong></article>
        <article class="card"><span>↗</span><strong>Built to grow</strong></article>
      </section>
    </main>
  </body>
</html>
