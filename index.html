<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A beautiful Hello World page" />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8fbff;
        --muted: #b9c3db;
        --accent: #8b5cf6;
        --accent-light: #38bdf8;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 1.5rem;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 16% 20%, rgba(56, 189, 248, .24), transparent 28rem),
          radial-gradient(circle at 83% 74%, rgba(139, 92, 246, .3), transparent 30rem),
          #090d1b;
      }

      .orb {
        position: fixed;
        width: 18rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(2px);
        opacity: .35;
        background: linear-gradient(135deg, var(--accent-light), var(--accent));
        animation: drift 12s ease-in-out infinite alternate;
      }

      .orb:first-child { top: -7rem; right: -4rem; }
      .orb:last-child { bottom: -9rem; left: -5rem; animation-delay: -6s; }

      main {
        position: relative;
        width: min(100%, 44rem);
        padding: clamp(2rem, 6vw, 4.5rem);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, .16);
        border-radius: 2rem;
        background: rgba(17, 24, 48, .68);
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, .35);
        backdrop-filter: blur(18px);
        animation: enter .8s cubic-bezier(.2, .8, .2, 1) both;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: var(--accent-light);
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6.5rem);
        line-height: .95;
        letter-spacing: -.075em;
        background: linear-gradient(110deg, #fff, #c4b5fd 50%, #7dd3fc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 31rem;
        margin: 1.6rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.7;
      }

      .sparkle {
        display: inline-grid;
        place-items: center;
        width: 3.25rem;
        height: 3.25rem;
        margin-top: 2rem;
        border-radius: 1rem;
        color: #fff;
        font-size: 1.5rem;
        background: linear-gradient(135deg, var(--accent-light), var(--accent));
        box-shadow: 0 .75rem 1.8rem rgba(100, 100, 255, .32);
      }

      @keyframes enter {
        from { opacity: 0; transform: translateY(1.25rem) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes drift {
        to { transform: translate(2rem, 2.5rem) rotate(30deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb" aria-hidden="true"></div>
    <main>
      <p class="eyebrow">A fresh beginning</p>
      <h1>Hello, World!</h1>
      <p>One small page, an infinite number of possibilities. Make something wonderful today.</p>
      <span class="sparkle" aria-label="Sparkles">✦</span>
    </main>
    <div class="orb" aria-hidden="true"></div>
  </body>
</html>
