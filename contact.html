<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact the Hello World project" />
    <title>Contact Us</title>
    <style>
      :root { color-scheme: dark; --ink: #f8fbff; --muted: #b9c3db; --violet: #8b5cf6; --blue: #38bdf8; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 1.5rem; display: grid; place-items: center; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: radial-gradient(circle at 12% 12%, rgba(56,189,248,.22), transparent 26rem), radial-gradient(circle at 90% 82%, rgba(139,92,246,.3), transparent 30rem), #090d1b; }
      main { width: min(100%, 48rem); padding: clamp(2rem, 6vw, 4.5rem); border: 1px solid rgba(255,255,255,.16); border-radius: 2rem; background: rgba(17,24,48,.72); box-shadow: 0 2rem 5rem rgba(0,0,0,.35); backdrop-filter: blur(18px); }
      nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: clamp(3rem, 8vw, 5rem); }
      .brand, nav a { color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 750; }
      .brand { color: var(--ink); letter-spacing: -.02em; } .links { display: flex; gap: 1rem; }
      nav a:hover, nav a[aria-current="page"] { color: var(--ink); }
      .eyebrow { margin: 0 0 1rem; color: var(--blue); font-size: .78rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.8rem, 8vw, 5.3rem); letter-spacing: -.07em; line-height: .98; background: linear-gradient(110deg,#fff,#c4b5fd 50%,#7dd3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { color: var(--muted); line-height: 1.7; }
      form { display: grid; gap: 1rem; margin-top: 2rem; }
      label { display: grid; gap: .45rem; color: var(--ink); font-size: .9rem; font-weight: 700; }
      input, textarea { width: 100%; padding: .85rem 1rem; border: 1px solid rgba(255,255,255,.15); border-radius: .75rem; outline: none; color: var(--ink); font: inherit; background: rgba(255,255,255,.06); }
      input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(56,189,248,.14); }
      textarea { min-height: 7.5rem; resize: vertical; }
      button { justify-self: start; padding: .85rem 1.25rem; border: 0; border-radius: .75rem; color: white; cursor: pointer; font: inherit; font-weight: 800; background: linear-gradient(135deg, var(--blue), var(--violet)); box-shadow: 0 .75rem 1.8rem rgba(100,100,255,.25); }
      button:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Main navigation">
        <a class="brand" href="index.html">✦ Hello, World!</a>
        <span class="links"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></span>
      </nav>
      <p class="eyebrow">Say hello</p>
      <h1>Let's make a connection.</h1>
      <p>Have an idea or just want to share a thought? Leave a message below.</p>
      <form onsubmit="event.preventDefault(); this.querySelector('button').textContent = 'Message sent — thank you!'; this.querySelector('button').disabled = true;">
        <label>Name <input type="text" name="name" placeholder="Your name" required /></label>
        <label>Email <input type="email" name="email" placeholder="you@example.com" required /></label>
        <label>Message <textarea name="message" placeholder="Write your message..." required></textarea></label>
        <button type="submit">Send message</button>
      </form>
    </main>
  </body>
</html>
